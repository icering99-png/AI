claim:
  type: empirical_result
  text: "While engineering tools provide coverage of design concerns, they miss implications of end-to-end integration testing, latency, and cost of change, as focusing on data and control flow leads to missing many data-entity relationships, resource behavior, and deployment-related dependencies."
evidence:
  quote: "While the engineering tools provided coverage of design concerns, they missed implications of end-to-end integration testing, latency, and cost of change. In our study, we observed that the tools led the engineers to focus on data and control flow and therefore to miss many data-entity relationships, resource behavior, and deployment-related dependencies."
  extraction: manual_pdf_read
  verified: true
interpretation:
  statement: "Ограничение анализа исключительно потоком данных и управления (data and control flow) скрывает сквозные зависимости между сущностями данных, поведением ресурсов и развертыванием. Это обосновывает необходимость мульти-ракурсного анализа зависимостей (multi-view dependency analysis) при проектировании и оценке влияния изменений."
  confidence: supported
status: VERIFIED
