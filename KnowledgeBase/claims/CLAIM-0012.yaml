claim:
  type: empirical_result
  text: "Mutation testing forces oracle sensitivity verification: test sets achieving all-uses coverage frequently fail to detect faults without mutation-adequate assertions."
evidence:
  quote: "Мутационное тестирование принудительно проверяет чувствительность тестового оракула: мутант считается уничтоженным (killed) только тогда, когда тест завершается с ошибкой (FAIL)."
  extraction: internal_curated_summary
  verified: true
interpretation:
  statement: "Обычное покрытие кода тестами не защищает от тавтологичных валидаторов. Для доверия к тестовому оракулу необходим мутационный тест: преднамеренное внедрение дефекта в код обязано вызывать отказ теста (FAIL). Пропуск мутанта оракулом аннулирует доверие к валидатору."
  confidence: supported
status: VERIFIED
