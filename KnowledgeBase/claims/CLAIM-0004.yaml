claim:
  type: formal_definition
  text: "Verifying agentic systems (STEADs) against First-Order Computation Tree Logic (FO-CTL) specifications is undecidable in general, but is PSPACE-complete under a finite-domain restriction."
evidence:
  quote: "We formalise them as Stateful Tool-Enabled Agentic Deployments (STEADs), give their semantics, define the problem of verifying them against First-Order Computation Tree Logic (FO-CTL) specifications, and show that it is undecidable. We identify sufficient conditions for exact preservation of FO-CTL specifications under a finite-domain restriction, over which verification is PSPACE-complete."
  extraction: manual_pdf_read
  verified: true
interpretation:
  statement: "Верификация поведения автономного агента над персистентными данными алгоритмически неразрешима в общем виде. Строгие системные гарантии выполнимы только при сведении пространства поиска к конечной ограниченной области (finite-domain restriction), что переводит верификацию в класс PSPACE-complete и математически обосновывает необходимость жестких детерминированных гейтов с ограниченным пространством допустимых состояний."
  confidence: supported
status: VERIFIED
