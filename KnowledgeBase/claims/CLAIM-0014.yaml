claim:
  type: standard_requirement
  text: "Software development practices must systematically track security requirements and provenance data for all release components (Tasks PS.3.2 and PW.1.2) to prevent unauthorized tampering and supply chain vulnerability injection."
evidence:
  quote: "Added PS.3.2 on collecting and sharing provenance data for all components of software releases. Added PW.1.2 on tracking software security requirements, risks, and design decisions."
  extraction: standards_specification_overview
  verified: true
interpretation:
  statement: "Каждый программный компонент и модификация системы обязаны сопровождаться непрерывным сбором данных происхождения (provenance metadata) и явной фиксацией архитектурных требований безопасности. Непроверенные или сторонние артефакты без доказанного провенанса подлежат блокировке в точке входа (Gate 10 Fail-Closed)."
  confidence: supported
status: VERIFIED
