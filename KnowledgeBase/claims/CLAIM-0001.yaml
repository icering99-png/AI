interpretation:
  statement: "Автономная языковая модель не способна надежно исправлять собственные логические ошибки без внешнего независимого сигнала (тесты, линтеры, изолированный аудитор). Попытка самооценки и одновременного исправления кода в рамках одного агента ведёт к деградации качества, что обосновывает строгое архитектурное правило разделения ролей (Critic Never Repairs) и внешний детерминированный контур верификации."
